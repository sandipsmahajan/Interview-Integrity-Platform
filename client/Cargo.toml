[workspace]
resolver = "2"
members = [
  "agent",
  "browser",
  "camera",
  "ipc",
  "launcher",
  "logger",
  "microphone",
  "network",
  "plugins",
  "policy",
  "screenshare",
  "security",
  "storage",
  "system",
  "telemetry",
  "updater"
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Proprietary"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
