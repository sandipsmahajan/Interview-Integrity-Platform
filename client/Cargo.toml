[workspace]
resolver = "2"
members = [
  "agent",
  "browser",
  "camera",
  "config",
  "integrity-pro",
  "integrity-service",
  "ipc",
  "launcher",
  "logger",
  "microphone",
  "network",
  "plugins",
  "policy",
  "screenshare",
  "security",
  "storage",
  "system",
  "telemetry",
  "updater",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Proprietary"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
open = "5"
