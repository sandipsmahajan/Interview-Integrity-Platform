# ---------------------------------------------------------------------------
# Interview Integrity Platform - full local development stack.
#
# Infrastructure (postgres, redis, kafka, minio, mailpit) plus all 19
# microservices on a single bridge network. Services reach each other through
# Compose DNS names (kafka:9092, redis:6379, postgres:5432, minio:9000,
# mailpit:1025, discovery-service:8761) which is exactly what the "docker"
# Spring profile (infra/config/application-docker.yml) defaults to.
#
# Usage:
#   docker compose -f infra/docker/docker-compose.yml up -d --build
#   docker compose -f infra/docker/docker-compose.yml logs -f api-gateway
#   docker compose -f infra/docker/docker-compose.yml down
#
# Dockerfiles live next to each service (services/<name>/Dockerfile) and build
# a fat bootJar in a multi-stage build.
# ---------------------------------------------------------------------------

name: interview-integrity

x-app-base: &app-base
  build:
    context: ../..
  image: interview-integrity/app:0.1.0
  restart: unless-stopped
  volumes:
    - ../config:/etc/integrity/config:ro
  environment:
    SPRING_PROFILES_ACTIVE: docker
    SPRING_CONFIG_LOCATION: /etc/integrity/config/
    JWT_SECRET: local-development-change-me-32-bytes-minimum
  depends_on:
    discovery-service:
      condition: service_started

services:
  # --- Infrastructure ------------------------------------------------------

  # Relational store shared by every service. The init script mounted into
  # /docker-entrypoint-initdb.d creates one database per service on first boot.
  postgres:
    image: postgres:16
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        tr -d '\r' < /init/init-databases.sh > /docker-entrypoint-initdb.d/init-databases.sh
        exec /usr/local/bin/docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: interview_integrity
      POSTGRES_USER: integrity
      POSTGRES_PASSWORD: integrity
    ports: [ "5432:5432" ]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/init/init-databases.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U integrity -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # In-memory cache used for rate limiting and short-lived tokens.
  redis:
    image: redis:7
    restart: unless-stopped
    ports: [ "6379:6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Event bus for cross-service events (audit, notifications, integrations).
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  # S3-compatible object storage for files and documents.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: integrity
      MINIO_ROOT_PASSWORD: integrity-secret
    ports: [ "9000:9000", "9001:9001" ]
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Dev mail server - captures SMTP traffic and exposes a web UI on :8025.
  mailpit:
    image: axllent/mailpit:v1.22.2
    restart: unless-stopped
    ports: [ "1025:1025", "8025:8025" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:8025/readyz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Microservices --------------------------------------------------------

  # In-memory service registry; every other service registers with it.
  discovery-service:
    <<: *app-base
    build:
      context: ../..
      dockerfile: services/discovery-service/Dockerfile
    image: interview-integrity/discovery-service:0.1.0
    ports: [ "8761:8761" ]
    depends_on: []

  # Single entry point for all HTTP traffic; routes /api paths to services.
  api-gateway:
    <<: *app-base
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    image: interview-integrity/api-gateway:0.1.0
    ports: [ "8080:8080" ]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_LOCATION: /etc/integrity/config/
      JWT_SECRET: local-development-change-me-32-bytes-minimum
      GATEWAY_DISCOVERY_LOCATOR_ENABLED: "false"
    depends_on:
      discovery-service:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_started

  # Authentication, authorization, sessions, MFA and trusted devices.
  identity-service:
    <<: *app-base
    build:
      context: ../..
      dockerfile: services/identity-service/Dockerfile
    image: interview-integrity/identity-service:0.1.0
