      JWT_SECRET: local-development-change-me-32-bytes-minimum
      DB_NAME: identity_db
    depends_on:
      discovery-service:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # Tenant organizations, plans, subscriptions, departments and teams.
