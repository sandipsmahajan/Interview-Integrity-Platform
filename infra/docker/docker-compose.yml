# Interview Integrity platform — local development stack.
#
# Infrastructure (postgres, redis, kafka, minio) runs on the default bridge
# network with host port mappings. Every microservice uses `network_mode: host`
# so the api-gateway route table (which targets http://localhost:<port>) and the
# default application.yml connection strings (localhost:<port>) resolve directly.
# This mirrors running every service locally with `./gradlew bootRun`.
#
# Dockerfiles live next to each service (services/<name>/Dockerfile) and build a
# fat bootJar in a multi-stage build.

name: interview-integrity

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: interview_integrity
      POSTGRES_USER: integrity
      POSTGRES_PASSWORD: integrity
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrity"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: integrity
      MINIO_ROOT_PASSWORD: integrity-secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data

  api-gateway:
    build: { context: ../.., dockerfile: services/api-gateway/Dockerfile }
    network_mode: host
    depends_on: [postgres, redis, kafka]
    environment:
      JWT_SECRET: local-development-change-me-32-bytes-minimum

  discovery-service:
    build: { context: ../.., dockerfile: services/discovery-service/Dockerfile }
    network_mode: host
    depends_on: [postgres]
    environment:
      JWT_SECRET: local-development-change-me-32-bytes-minimum

  desktop-client-service:
    build: { context: ../.., dockerfile: services/desktop-client-service/Dockerfile }
    network_mode: host
    depends_on: [kafka]
    environment:
      JWT_SECRET: local-development-change-me-32-bytes-minimum

  identity-service:
    build: { context: ../.., dockerfile: services/identity-service/Dockerfile }
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      JWT_SECRET: local-development-change-me-32-bytes-minimum

  organization-service:
