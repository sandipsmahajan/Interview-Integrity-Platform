{{/*
ServiceAccount per enabled service. Used for IRSA (IAM Roles for Service
Accounts) in qa/uat/prod and as a stable identity for network policies.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "integrity.labels" (merge (deepCopy $svc) (dict "name" $name "Chart" $.Chart "Release" $.Release)) | nindent 4 }}
{{- if $svc.irsaRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $svc.irsaRoleArn }}
{{- end }}
{{- end }}
{{- end }}
