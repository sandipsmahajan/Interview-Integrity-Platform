# ---------------------------------------------------------------------------
# Integrity Pro - base Helm values.
#
# Everything is overridable per environment through values-local.yaml,
# values-dev.yaml, values-qa.yaml, values-uat.yaml and values-prod.yaml.
# The managed data plane (RDS / ElastiCache / MSK / S3 / SES) endpoints are
# injected into the env-specific files from Terraform outputs at deploy time.
# ---------------------------------------------------------------------------

global:
  # Deployment environment label (local | dev | qa | uat | prod)
  environment: local

  image:
    registry: ghcr.io/sandipsmahajan
    tag: 0.1.0
    pullPolicy: IfNotPresent
    pullSecret: ""

  # Spring profile activated by every service (see infra/config/).
  spring:
    profile: kubernetes
    configLocation: /etc/integrity/config/

  # External ConfigMap (created by CI from infra/config/) and Secret
  # (created by CI from AWS Secrets Manager). The chart references these
  # rather than owning them so infra/config stays the single source of truth.
  config:
    configMapName: integrity-config
    mountPath: /etc/integrity/config

  secrets:
    name: integrity-secrets

  # Data plane endpoints (defaults target the in-cluster dev stack).
  dataPlane:
    db:
      host: postgres.integrity.svc.cluster.local
      port: "5432"
      username: integrity
      # password lives in the integrity-secrets Secret (DB_PASSWORD)
    redis:
      host: redis.integrity.svc.cluster.local
      port: "6379"
    kafka:
      bootstrapServers: kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
      saslEnabled: "false"
      saslUsername: ""
    mail:
      host: mailpit.integrity.svc.cluster.local
      port: "1025"
      from: no-reply@integritypro.app
    storage:
      endpoint: http://minio.integrity.svc.cluster.local:9000
      region: us-east-1
    eureka:
      url: http://discovery-service.integrity.svc.cluster.local:8761/eureka

  platform:
    timezone: UTC
    frontendBaseUrl: http://localhost:5173

  app:
    name: Integrity Pro

  # Prometheus annotations on every pod when true.
  monitoring:
    enabled: true

  jvm:
    # Applied to every service unless overridden per service.
    heapInitial: -Xms256m
    heapMax: -Xmx512m

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  apiHost: api.integrity.local
  portalHost: portal.integrity.local
  apiTlsSecret: ""
  portalTlsSecret: ""
  # Optional portal frontend backend (React/Vite build served as static files).
  portalBackend:
    service: ""
    port: http

# Namespace-level default-deny network policy with selective egress.
networkPolicy:
  enabled: true

# ---------------------------------------------------------------------------
# Service catalogue. `image` is the ECR/ghcr image name; `port` is the service
# port (SERVER_PORT); `dbName` sets DB_NAME (empty = no database).
# ---------------------------------------------------------------------------
services:
  discovery:
    enabled: true
    image: discovery-service
    port: 8761
    replicas: 1
    dbName: ""
    needsRedis: false
    needsKafka: false
    hpa: { enabled: false }
    pdb: { enabled: true, minAvailable: 1 }
  api-gateway:
    enabled: true
    image: api-gateway
    port: 8080
    replicas: 2
    dbName: ""
    needsRedis: true
    needsKafka: false
    extraEnv:
      GATEWAY_DISCOVERY_LOCATOR_ENABLED: "false"
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 8, cpuTarget: 70 }
    pdb: { enabled: true, minAvailable: 1 }
  identity:
    enabled: true
    image: identity-service
    port: 8081
    replicas: 2
    dbName: identity_db
    needsRedis: false
    needsKafka: true
