# ---------------------------------------------------------------------------
# QA values.
#
# Managed data plane (RDS, ElastiCache, Amazon MSK with SASL/SCRAM, Amazon
# SES SMTP sandbox, S3). Spring profile: qa. Endpoints injected by CI from
# the "qa" Terraform root outputs.
# ---------------------------------------------------------------------------
global:
  environment: qa
  image:
    registry: AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/integrity-qa
    tag: latest
    pullPolicy: IfNotPresent
    pullSecret: ecr-registry-secret
  spring:
    profile: qa
  dataPlane:
    db:
      host: CHANGE_ME_QA_RDS_ENDPOINT
      port: "5432"
      username: integrity
    redis:
      host: CHANGE_ME_QA_REDIS_ENDPOINT
      port: "6379"
    kafka:
      bootstrapServers: CHANGE_ME_QA_MSK_BOOTSTRAP
      saslEnabled: "true"
      saslUsername: integrity-msk
    mail:
      host: CHANGE_ME_SES_SMTP_ENDPOINT
      port: "587"
      from: no-reply@integritypro.app
    storage:
      endpoint: https://s3.us-east-1.amazonaws.com
    eureka:
      url: http://discovery-service.integrity.svc.cluster.local:8761/eureka

ingress:
  apiHost: api.qa.integritypro.example.com
  portalHost: portal.qa.integritypro.example.com
  apiTlsSecret: integrity-qa-api-tls
  portalTlsSecret: integrity-qa-portal-tls
