# ---------------------------------------------------------------------------
# Integrity Pro - "docker" Spring profile
#
# Used when the entire platform (infrastructure + all 19 microservices) runs
# inside Docker Compose. Services reach each other through Compose DNS names.
#
# Activation (see infra/docker/docker-compose.yml):
#   SPRING_PROFILES_ACTIVE=docker
#   SPRING_CONFIG_LOCATION=/etc/integrity/config/   (bind-mounted infra/config)
# ---------------------------------------------------------------------------
app:
  timezone: ${APP_TIMEZONE:UTC}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      acks: ${KAFKA_PRODUCER_ACKS:all}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:default}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:docker_db}
    pool:
      initial-size: ${DB_POOL_INITIAL_SIZE:4}
      max-size: ${DB_POOL_MAX_SIZE:16}
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:docker_db}
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

platform:
  storage:
    endpoint: ${PLATFORM_STORAGE_ENDPOINT:http://minio:9000}
    region: ${PLATFORM_STORAGE_REGION:us-east-1}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://discovery-service:8761/eureka}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.interviewintegrity: ${LOG_LEVEL_APP:INFO}
