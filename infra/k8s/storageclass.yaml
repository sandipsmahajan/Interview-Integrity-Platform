# Default storage class backed by Amazon EBS gp3 (SSD) with server-side
# encryption using the EKS cluster KMS key. Attached to every PersistentVolumeClaim
# created by the platform StatefulSets (PostgreSQL, MinIO) unless overridden.
#
# gp3 is the default SC on EKS; this class only pins the volume binding mode and
# ensures encryption-by-default is explicit in the manifests.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
