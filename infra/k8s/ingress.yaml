apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: integrity-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.interview-integrity.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: integrity-backend
                port:
                  number: 80
