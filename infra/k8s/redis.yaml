# ---------------------------------------------------------------------------
# In-cluster Redis (dev/local data plane only).
#
# Production, QA and UAT use Amazon ElastiCache Redis provisioned by Terraform.
# This Deployment provides spring.data.redis for the `kubernetes` Spring profile.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: integrity
  labels:
    app.kubernetes.io/part-of: integrity-pro
    app.kubernetes.io/component: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: integrity
  labels:
    app.kubernetes.io/part-of: integrity-pro
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsUser: 999
        runAsNonRoot: true
      containers:
        - name: redis
          image: redis:7
          imagePullPolicy: IfNotPresent
          args: ["--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
