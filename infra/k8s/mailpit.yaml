# ---------------------------------------------------------------------------
# In-cluster Mailpit (dev/local data plane only).
#
# SMTP server for the `kubernetes`/`docker`/`local` Spring profiles. Captures
# outbound mail and exposes a web UI on port 8025. Production, QA and UAT use
# Amazon SES SMTP.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: integrity
  labels:
    app.kubernetes.io/part-of: integrity-pro
    app.kubernetes.io/component: mailpit
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: ui
      port: 8025
      targetPort: ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: integrity
  labels:
    app.kubernetes.io/part-of: integrity-pro
    app.kubernetes.io/component: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.22.2
          imagePullPolicy: IfNotPresent
          args: ["--smtp", "0.0.0.0:1025", "--listen", "0.0.0.0:8025"]
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: ui
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /readyz
              port: ui
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
