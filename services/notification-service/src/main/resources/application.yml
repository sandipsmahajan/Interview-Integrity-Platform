spring:
  application:
    name: notification-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/notification_db
    username: integrity
    password: integrity
    pool:
      initial-size: 4
      max-size: 16
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/notification_db
    user: integrity
    password: integrity
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_SMTP_TIMEOUT:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:10000}

app:
  mail:
    from: ${MAIL_FROM:no-reply@integritypro.app}
    max-attempts: 3
    retry-base-delay: 1m
    worker-interval: 30s

security:
  jwt:
    secret: ${JWT_SECRET:local-development-change-me-32-bytes-minimum}
    issuer: interview-integrity
    audience: interview-integrity-api
    accessTokenTtl: 15m
    permitAll:
      - /actuator/health
      - /actuator/info
    corsAllowedOrigins:
      - http://localhost:5173
      - http://localhost:3000

server:
  port: 8090
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: notification-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.interviewintegrity: INFO
