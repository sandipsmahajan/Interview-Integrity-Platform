spring:
  application:
    name: notification-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    username: ${DB_USERNAME:integrity}
    password: ${DB_PASSWORD:integrity}
    pool:
      initial-size: ${DB_POOL_INITIAL_SIZE:4}
      max-size: ${DB_POOL_MAX_SIZE:16}
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    user: ${DB_USERNAME:integrity}
    password: ${DB_PASSWORD:integrity}
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-service}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_SMTP_TIMEOUT:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:10000}

app:
  timezone: ${APP_TIMEZONE:UTC}
  mail:
    from: ${MAIL_FROM:no-reply@integritypro.app}
    max-attempts: ${MAIL_MAX_ATTEMPTS:3}
    retry-base-delay: ${MAIL_RETRY_BASE_DELAY:1m}
    worker-interval: ${MAIL_WORKER_INTERVAL:30s}

security:
  jwt:
    secret: ${JWT_SECRET:local-development-change-me-32-bytes-minimum}
    issuer: ${JWT_ISSUER:interview-integrity}
    audience: ${JWT_AUDIENCE:interview-integrity-api}
    accessTokenTtl: ${JWT_ACCESS_TOKEN_TTL:15m}
    permitAll: ${JWT_PERMIT_ALL:/actuator/health,/actuator/info}
    corsAllowedOrigins: ${JWT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: notification-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.interviewintegrity: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:true}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
    lease-renewal-interval-in-seconds: ${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:30}
    lease-expiration-duration-in-seconds: ${EUREKA_LEASE_EXPIRATION_SECONDS:90}
