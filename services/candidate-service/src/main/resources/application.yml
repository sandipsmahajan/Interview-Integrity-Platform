spring:
  application:
    name: candidate-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/candidate_db
    username: integrity
    password: integrity
    pool:
      initial-size: 4
      max-size: 16
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/candidate_db
    user: integrity
    password: integrity
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092

security:
  jwt:
    secret: ${JWT_SECRET:local-development-change-me-32-bytes-minimum}
    issuer: interview-integrity
    audience: interview-integrity-api
    accessTokenTtl: 15m
    permitAll:
      - /actuator/health
      - /actuator/info
    corsAllowedOrigins:
      - http://localhost:5173
      - http://localhost:3000

server:
  port: 8084
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: candidate-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.interviewintegrity: INFO
