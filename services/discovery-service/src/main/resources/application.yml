spring:
  application:
    name: discovery-service

discovery:
  heartbeat-timeout-seconds: ${DISCOVERY_HEARTBEAT_TIMEOUT_SECONDS:60}

security:
  jwt:
    secret: ${JWT_SECRET:local-development-change-me-32-bytes-minimum}
    issuer: ${JWT_ISSUER:interview-integrity}
    audience: ${JWT_AUDIENCE:interview-integrity-api}
    accessTokenTtl: ${JWT_ACCESS_TOKEN_TTL:15m}
    permitAll: ${JWT_PERMIT_ALL:/actuator/health,/actuator/info}
    corsAllowedOrigins: ${JWT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  port: ${SERVER_PORT:8761}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: discovery-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.interviewintegrity: INFO
