app:
  timezone: ${APP_TIMEZONE:UTC}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: ${GATEWAY_DISCOVERY_LOCATOR_ENABLED:false}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

security:
  jwt:
    secret: ${JWT_SECRET:local-development-change-me-32-bytes-minimum}
    issuer: ${JWT_ISSUER:interview-integrity}
    audience: ${JWT_AUDIENCE:interview-integrity-api}
    accessTokenTtl: ${JWT_ACCESS_TOKEN_TTL:15m}
    permitAll: ${JWT_PERMIT_ALL:/actuator/health/readiness,/actuator/health/liveness,/actuator/info}
    corsAllowedOrigins: ${JWT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
    instances:
      recruiter-candidates:
        base-config: default
      identity:
        base-config: default
      interview-session-lifecycle:
        base-config: default
      organization:
        base-config: default
      recruiter:
        base-config: default
      candidate:
        base-config: default
      interview:
        base-config: default
      telemetry:
        base-config: default
      policy-engine:
        base-config: default
      report:
        base-config: default
      notification:
        base-config: default
      analytics:
        base-config: default
      audit:
        base-config: default
      storage:
        base-config: default
      feature-flag:
        base-config: default
      scheduler:
        base-config: default
      integration:
        base-config: default
      configuration:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
    instances:
      recruiter-candidates:
        base-config: default
      identity:
        base-config: default
      interview-session-lifecycle:
        base-config: default
      organization:
        base-config: default
      recruiter:
        base-config: default
      candidate:
        base-config: default
      interview:
        base-config: default
      telemetry:
        base-config: default
      policy-engine:
        base-config: default
      report:
        base-config: default
      notification:
        base-config: default
      analytics:
        base-config: default
      audit:
        base-config: default
      storage:
        base-config: default
      feature-flag:
        base-config: default
      scheduler:
        base-config: default
      integration:
        base-config: default
      configuration:
        base-config: default

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: api-gateway

logging:
  level:
    root: INFO
    com.integrity: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:true}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
    lease-renewal-interval-in-seconds: ${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:30}
    lease-expiration-duration-in-seconds: ${EUREKA_LEASE_EXPIRATION_SECONDS:90}
