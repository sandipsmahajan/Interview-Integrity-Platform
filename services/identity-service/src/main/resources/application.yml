spring:
  application:
    name: identity-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_db}
    username: ${DB_USERNAME:integrity}
    password: ${DB_PASSWORD:integrity}
    pool:
      initial-size: ${DB_POOL_INITIAL_SIZE:4}
      max-size: ${DB_POOL_MAX_SIZE:16}
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_db}
    user: ${DB_USERNAME:integrity}
    password: ${DB_PASSWORD:integrity}
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: ${KAFKA_PRODUCER_ACKS:all}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

security:
  jwt:
    secret: ${JWT_SECRET:local-development-change-me-32-bytes-minimum}
    issuer: ${JWT_ISSUER:interview-integrity}
    audience: ${JWT_AUDIENCE:interview-integrity-api}
    accessTokenTtl: ${JWT_ACCESS_TOKEN_TTL:15m}
    permitAll: ${JWT_PERMIT_ALL:/actuator/health,/actuator/info}
    corsAllowedOrigins: ${JWT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app:
  auth:
    app-name: ${APP_NAME:Integrity Pro}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    mfa-challenge-ttl: ${MFA_CHALLENGE_TTL:PT5M}
    mfa-email-purpose: ${MFA_EMAIL_PURPOSE:mfa-login}
    expose-reset-token: ${EXPOSE_RESET_TOKEN:false}
    reset-request-interval: ${RESET_REQUEST_INTERVAL:PT1M}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    login-lockout: ${LOGIN_LOCKOUT:PT15M}
    max-mfa-challenge-attempts: ${MAX_MFA_CHALLENGE_ATTEMPTS:5}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: identity-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.interviewintegrity: INFO
