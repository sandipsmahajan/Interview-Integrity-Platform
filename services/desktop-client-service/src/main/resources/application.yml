app:
  timezone: ${APP_TIMEZONE:UTC}
spring:
  application:
    name: desktop-client-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:desktop-client-relay}

desktop:
  relay-topics: ${DESKTOP_RELAY_TOPICS:telemetry.received.v1,policy.violation.v1,interview.started.v1,interview.completed.v1}

security:
  jwt:
    secret: ${JWT_SECRET:local-development-change-me-32-bytes-minimum}
    issuer: ${JWT_ISSUER:interview-integrity}
    audience: ${JWT_AUDIENCE:interview-integrity-api}
    accessTokenTtl: ${JWT_ACCESS_TOKEN_TTL:15m}
    permitAll: ${JWT_PERMIT_ALL:/actuator/health,/actuator/info,/ws/**}
    corsAllowedOrigins: ${JWT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: desktop-client-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.interviewintegrity: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:true}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
    lease-renewal-interval-in-seconds: ${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:30}
    lease-expiration-duration-in-seconds: ${EUREKA_LEASE_EXPIRATION_SECONDS:90}
