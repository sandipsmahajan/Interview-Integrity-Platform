spring:
  application:
    name: interview-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/interview_db
    username: integrity
    password: integrity
    pool:
      initial-size: 4
      max-size: 16
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/interview_db
    user: integrity
    password: integrity
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8085
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: interview-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.interviewintegrity: INFO
