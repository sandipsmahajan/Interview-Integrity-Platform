spring:
  application:
    name: interview-integrity-backend
  r2dbc:
    url: ${DATABASE_URL:r2dbc:postgresql://localhost:5432/interview_integrity}
    username: ${DATABASE_USER:integrity}
    password: ${DATABASE_PASSWORD:integrity}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
security:
  jwt:
    hmac-secret: ${JWT_HMAC_SECRET:local-development-change-me-32-bytes-minimum}
